services:
  db:
    image: ${WPAI_CI_IMAGE_REGISTRY:-}mariadb:lts
    # CI uses preloaded, digest-verified images; local development pulls normally.
    pull_policy: ${WPAI_CI_PULL_POLICY:-missing}
    environment:
      MARIADB_ROOT_PASSWORD: wordpress
      MARIADB_DATABASE: wordpress
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 20s
    volumes:
      - db-data:/var/lib/mysql

  wordpress:
    image: ${WPAI_CI_IMAGE_REGISTRY:-}wordpress:${WORDPRESS_TAG:-6.9-php8.4-apache}
    # CI uses preloaded, digest-verified images; local development pulls normally.
    pull_policy: ${WPAI_CI_PULL_POLICY:-missing}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "127.0.0.1::80"
    volumes:
      - wordpress-data:/var/www/html

  cli:
    image: ${WPAI_CI_IMAGE_REGISTRY:-}wordpress:cli-php8.4
    # CI uses preloaded, digest-verified images; local development pulls normally.
    pull_policy: ${WPAI_CI_PULL_POLICY:-missing}
    entrypoint: ["wp"]
    user: "0:0"
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-data:/var/www/html

volumes:
  db-data: {}
  wordpress-data: {}
