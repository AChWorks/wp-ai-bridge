name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  # CI-only: canonical Docker Hub Official Images. Every amd64 manifest and
  # digest is verified before sharing a single same-run archive with test jobs.
  # GitHub-hosted runners are exempt from public Docker Hub pull-rate limits.
  # Local compose keeps its normal references unless explicitly overridden.
  WPAI_CI_IMAGE_REGISTRY: docker.io/library/
  WPAI_CI_PULL_POLICY: never

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image-supply:
    name: Official OCI image bundle / amd64
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout image metadata harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check strict image metadata transformation
        run: python3 tests/issue199-image-metadata.py

      - name: Resolve and pull exact Docker Official Image manifests once
        shell: bash
        run: |
          set -euo pipefail
          images=()
          for image in \
            mariadb:lts \
            wordpress:6.9-php8.4-apache \
            wordpress:php8.4-apache \
            wordpress:cli-php8.4; do
            ref="${WPAI_CI_IMAGE_REGISTRY}${image}"
            details="$(docker buildx imagetools inspect "$ref")"
            digest="$(sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' <<< "$details" | head -n 1)"
            if ! grep -Eq 'linux/amd64' <<< "$details" || ! grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$digest"; then
              echo "::error::Missing trustworthy amd64 manifest/digest for ${ref}"
              exit 1
            fi
            echo "Verified ${ref}@${digest} for linux/amd64"
            # Bound registry request bursts even for supported public images.
            # Missing digests/platforms still fail the supply gate closed.
            sleep 2
            for attempt in 1 2 3; do
              if docker pull "${ref}@${digest}"; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "::error::Verified OCI image pull failed after 3 attempts: ${ref}@${digest}"
                exit 1
              fi
              # Bounded backoff for transient public-registry throttling.
              sleep $(( attempt * 15 ))
            done
            docker tag "${ref}@${digest}" "$ref"
            images+=("$ref")
            sleep 2
          done
          # Metadata-only PHP-node derivatives keep every official filesystem
          # layer; removing the inherited child VOLUME permits one common mount.
          derived_images=()
          for source in "${images[@]}"; do
            if [[ "$source" == *wordpress:* ]]; then
              derived="$(python3 bin/issue199-completion-image.py prepare "$source")"
              derived_images+=("$derived")
            fi
          done
          docker save --output "${RUNNER_TEMP}/wpai-ci-images.tar" "${images[@]}" "${derived_images[@]}"
          ls -lh "${RUNNER_TEMP}/wpai-ci-images.tar"

      - name: Share same-run verified images with isolated test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  quality:
    name: Quality / PHP 8.4
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality gates
        run: composer check

      - name: Upload validated plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-ai-bridge
          path: build/wp-ai-bridge.zip
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: image-supply
    name: Integration / ${{ matrix.wordpress_tag }} / MCP Adapter ${{ matrix.mcp_adapter_version }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.6.1'
          - wordpress_tag: php8.4-apache
            optional_providers: '1'
            mcp_adapter_version: '0.6.1'
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.7.0'
          - wordpress_tag: php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.7.0'
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.7.1'
          - wordpress_tag: php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.7.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified OCI image bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images

      - name: Load images without remote pulls
        run: |
          docker load --input "${RUNNER_TEMP}/wpai-ci-images/wpai-ci-images.tar"
          docker image inspect \
            "${WPAI_CI_IMAGE_REGISTRY}mariadb:lts" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:6.9-php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:cli-php8.4" \
            --format 'Platform={{.Os}}/{{.Architecture}} ID={{.Id}}'

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run isolated WordPress integration suite
        env:
          RUN_OPTIONAL_PROVIDERS: '${{ matrix.optional_providers }}'
          MCP_ADAPTER_EXPECTED_VERSION: '${{ matrix.mcp_adapter_version }}'
          MCP_ADAPTER_URL: https://github.com/WordPress/mcp-adapter/releases/download/v${{ matrix.mcp_adapter_version }}/mcp-adapter.zip
        run: bash bin/run-integration.sh '${{ matrix.wordpress_tag }}'

  specialized:
    needs: image-supply
    name: ${{ matrix.name }} / ${{ matrix.wordpress_tag }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: php8.4-apache
          - name: Issue 80 refresh recovery
            runner: bin/run-issue80-refresh-recovery.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 80 refresh recovery
            runner: bin/run-issue80-refresh-recovery.sh
            wordpress_tag: php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Issue 134 external HTTPS Media byte exchange
            runner: bin/run-issue134-external-media.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 134/139 external HTTPS native WXR import and export
            runner: bin/run-issue139-external-wxr.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Canonical identity
            runner: bin/run-canonical-identity.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Canonical identity
            runner: bin/run-canonical-identity.sh
            wordpress_tag: php8.4-apache
          - name: Published release ZIP upgrade
            runner: bin/run-published-upgrade.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Published release ZIP upgrade
            runner: bin/run-published-upgrade.sh
            wordpress_tag: php8.4-apache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified OCI image bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images

      - name: Load images without remote pulls
        run: |
          docker load --input "${RUNNER_TEMP}/wpai-ci-images/wpai-ci-images.tar"
          docker image inspect \
            "${WPAI_CI_IMAGE_REGISTRY}mariadb:lts" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:6.9-php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:cli-php8.4" \
            --format 'Platform={{.Os}}/{{.Architecture}} ID={{.Id}}'

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run specialized regression suite
        run: bash '${{ matrix.runner }}' '${{ matrix.wordpress_tag }}'

  database-write:
    needs: image-supply
    name: Typed database writes / ${{ matrix.database_engine }} / WordPress 6.9
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database_engine: [mariadb, mysql]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified common OCI image bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images

      - name: Load common images without remote pulls
        run: |
          docker load --input "${RUNNER_TEMP}/wpai-ci-images/wpai-ci-images.tar"
          docker image inspect \
            "${WPAI_CI_IMAGE_REGISTRY}mariadb:lts" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:6.9-php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:cli-php8.4" \
            --format 'Platform={{.Os}}/{{.Architecture}} ID={{.Id}}'

      - name: Resolve and verify the focused official MySQL 8.4 amd64 image
        if: ${{ matrix.database_engine == 'mysql' }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep this image out of the common artifact: unrelated jobs do not
          # download MySQL. Bind Compose to the exact selected manifest digest.
          ref='docker.io/library/mysql:8.4'
          index_digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          if ! grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$index_digest"; then
            echo "::error::Missing trustworthy manifest digest for ${ref}"
            exit 1
          fi
          manifest="$(docker buildx imagetools inspect "${ref}@${index_digest}" --raw)"
          platform_digest="$(python3 -c '
          import json, re, sys
          document = json.load(sys.stdin)
          matches = [entry for entry in document.get("manifests", [])
                     if entry.get("platform", {}).get("os") == "linux"
                     and entry.get("platform", {}).get("architecture") == "amd64"
                     and entry.get("platform", {}).get("variant", "") in ("", "v1")]
          if len(matches) != 1 or not re.fullmatch(r"sha256:[0-9a-f]{64}", matches[0].get("digest", "")):
              sys.exit("Missing or ambiguous verified linux/amd64 MySQL manifest")
          print(matches[0]["digest"])
          ' <<< "$manifest")"
          echo "Verified ${ref}@${index_digest}; linux/amd64 manifest ${platform_digest}"
          for attempt in 1 2 3; do
            if docker pull --platform linux/amd64 "${ref}@${platform_digest}"; then
              break
            fi
            if [[ "$attempt" == '3' ]]; then
              echo "::error::Verified MySQL image pull failed after 3 attempts: ${ref}@${platform_digest}"
              exit 1
            fi
            sleep $(( attempt * 15 ))
          done
          actual_platform="$(docker image inspect "${ref}@${platform_digest}" --format '{{.Os}}/{{.Architecture}}')"
          if [[ "$actual_platform" != 'linux/amd64' ]]; then
            echo "::error::Pulled MySQL platform mismatch: ${actual_platform}"
            exit 1
          fi
          echo "WPAI_DATABASE_WRITE_MYSQL_IMAGE=${ref}@${platform_digest}" >> "$GITHUB_ENV"

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run isolated typed-write transaction and recovery regressions
        env:
          MCP_ADAPTER_EXPECTED_VERSION: '0.7.1'
          MCP_ADAPTER_URL: https://github.com/WordPress/mcp-adapter/releases/download/v0.7.1/mcp-adapter.zip
        run: bash bin/run-issue199-database-write.sh '${{ matrix.database_engine }}' '6.9-php8.4-apache'
