name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  # CI-only: Docker-published Official Images on the verified ECR Public namespace.
  # Local compose keeps the original Docker Hub references unless explicitly overridden.
  WPAI_CI_IMAGE_REGISTRY: public.ecr.aws/docker/library/
  WPAI_CI_PULL_POLICY: never

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image-supply:
    name: Official OCI image bundle / amd64
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve and pull exact Docker Official Image manifests once
        shell: bash
        run: |
          set -euo pipefail
          images=()
          for image in \
            mariadb:lts \
            wordpress:6.9-php8.4-apache \
            wordpress:php8.4-apache \
            wordpress:cli-php8.4; do
            ref="${WPAI_CI_IMAGE_REGISTRY}${image}"
            details="$(docker buildx imagetools inspect "$ref")"
            digest="$(sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' <<< "$details" | head -n 1)"
            if ! grep -Eq 'linux/amd64' <<< "$details" || ! grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$digest"; then
              echo "::error::Missing trustworthy amd64 manifest/digest for ${ref}"
              exit 1
            fi
            echo "Verified ${ref}@${digest} for linux/amd64"
            # ECR Public limits unauthenticated pulls to 1/s. The manifest
            # inspection can consume a request immediately before docker pull.
            sleep 2
            for attempt in 1 2 3; do
              if docker pull "${ref}@${digest}"; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                echo "::error::Verified OCI image pull failed after 3 attempts: ${ref}@${digest}"
                exit 1
              fi
              # Bounded backoff for transient public-registry throttling.
              sleep $(( attempt * 15 ))
            done
            docker tag "${ref}@${digest}" "$ref"
            images+=("$ref")
            sleep 2
          done
          docker save --output "${RUNNER_TEMP}/wpai-ci-images.tar" "${images[@]}"
          ls -lh "${RUNNER_TEMP}/wpai-ci-images.tar"

      - name: Share same-run verified images with isolated test jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  quality:
    name: Quality / PHP 8.4
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality gates
        run: composer check

      - name: Upload validated plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-ai-bridge
          path: build/wp-ai-bridge.zip
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: image-supply
    name: Integration / ${{ matrix.wordpress_tag }} / MCP Adapter ${{ matrix.mcp_adapter_version }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.6.1'
          - wordpress_tag: php8.4-apache
            optional_providers: '1'
            mcp_adapter_version: '0.6.1'
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.7.0'
          - wordpress_tag: php8.4-apache
            optional_providers: '0'
            mcp_adapter_version: '0.7.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified OCI image bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images

      - name: Load images without remote pulls
        run: |
          docker load --input "${RUNNER_TEMP}/wpai-ci-images/wpai-ci-images.tar"
          docker image inspect \
            "${WPAI_CI_IMAGE_REGISTRY}mariadb:lts" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:6.9-php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:cli-php8.4" \
            --format 'Platform={{.Os}}/{{.Architecture}} ID={{.Id}}'

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run isolated WordPress integration suite
        env:
          RUN_OPTIONAL_PROVIDERS: '${{ matrix.optional_providers }}'
          MCP_ADAPTER_EXPECTED_VERSION: '${{ matrix.mcp_adapter_version }}'
          MCP_ADAPTER_URL: https://github.com/WordPress/mcp-adapter/releases/download/v${{ matrix.mcp_adapter_version }}/mcp-adapter.zip
        run: bash bin/run-integration.sh '${{ matrix.wordpress_tag }}'

  specialized:
    needs: image-supply
    name: ${{ matrix.name }} / ${{ matrix.wordpress_tag }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: php8.4-apache
          - name: Issue 80 refresh recovery
            runner: bin/run-issue80-refresh-recovery.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 80 refresh recovery
            runner: bin/run-issue80-refresh-recovery.sh
            wordpress_tag: php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Canonical identity
            runner: bin/run-canonical-identity.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Canonical identity
            runner: bin/run-canonical-identity.sh
            wordpress_tag: php8.4-apache
          - name: Published 0.4.2 upgrade to candidate
            runner: bin/run-published-upgrade.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Published 0.4.2 upgrade to candidate
            runner: bin/run-published-upgrade.sh
            wordpress_tag: php8.4-apache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore verified OCI image bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wpai-ci-official-images
          path: ${{ runner.temp }}/wpai-ci-images

      - name: Load images without remote pulls
        run: |
          docker load --input "${RUNNER_TEMP}/wpai-ci-images/wpai-ci-images.tar"
          docker image inspect \
            "${WPAI_CI_IMAGE_REGISTRY}mariadb:lts" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:6.9-php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:php8.4-apache" \
            "${WPAI_CI_IMAGE_REGISTRY}wordpress:cli-php8.4" \
            --format 'Platform={{.Os}}/{{.Architecture}} ID={{.Id}}'

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run specialized regression suite
        run: bash '${{ matrix.runner }}' '${{ matrix.wordpress_tag }}'
