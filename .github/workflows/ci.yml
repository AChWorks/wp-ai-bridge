name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality / PHP 8.4
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality gates
        run: composer check

      - name: Upload validated plugin ZIP
        if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp-ai-bridge
          path: build/wp-ai-bridge.zip
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration / ${{ matrix.wordpress_tag }}
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
          - wordpress_tag: php8.4-apache
            optional_providers: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run isolated WordPress integration suite
        env:
          RUN_OPTIONAL_PROVIDERS: '${{ matrix.optional_providers }}'
        run: bash bin/run-integration.sh '${{ matrix.wordpress_tag }}'

  specialized:
    name: ${{ matrix.name }} / ${{ matrix.wordpress_tag }}
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Issue 47 migration
            runner: bin/run-issue47-migration.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 47 migration
            runner: bin/run-issue47-migration.sh
            wordpress_tag: php8.4-apache
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run specialized regression suite
        run: bash '${{ matrix.runner }}' '${{ matrix.wordpress_tag }}'
