name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

env:
  # CI-only: Docker-published Official Images on the verified ECR Public namespace.
  # Local compose keeps the original Docker Hub references unless explicitly overridden.
  WPAI_CI_IMAGE_REGISTRY: public.ecr.aws/docker/library/

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image-supply:
    name: Official OCI image manifests / amd64
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm expected official tags, architecture, and immutable digests
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            mariadb:lts \
            wordpress:6.9-php8.4-apache \
            wordpress:php8.4-apache \
            wordpress:cli-php8.4; do
            ref="${WPAI_CI_IMAGE_REGISTRY}${image}"
            details="$(docker buildx imagetools inspect "$ref")"
            if ! grep -Eq 'linux/amd64' <<< "$details"; then
              echo "::error::Missing linux/amd64 manifest for ${ref}"
              exit 1
            fi
            printf '%s\n' "$details" | sed -n '1,17p'
            sleep 2
          done

  quality:
    name: Quality / PHP 8.4
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality gates
        run: composer check

      - name: Upload validated plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-ai-bridge
          path: build/wp-ai-bridge.zip
          if-no-files-found: error
          retention-days: 7

  integration:
    needs: image-supply
    name: Integration / ${{ matrix.wordpress_tag }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress_tag: 6.9-php8.4-apache
            optional_providers: '0'
          - wordpress_tag: php8.4-apache
            optional_providers: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run isolated WordPress integration suite
        env:
          RUN_OPTIONAL_PROVIDERS: '${{ matrix.optional_providers }}'
        run: bash bin/run-integration.sh '${{ matrix.wordpress_tag }}'

  specialized:
    needs: image-supply
    name: ${{ matrix.name }} / ${{ matrix.wordpress_tag }}
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Single-site regressions
            runner: bin/run-single-site-regressions.sh
            wordpress_tag: php8.4-apache
          - name: Issue 80 refresh recovery
            runner: bin/run-issue80-refresh-recovery.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 80 refresh recovery
            runner: bin/run-issue80-refresh-recovery.sh
            wordpress_tag: php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: User/auth multisite regressions
            runner: bin/run-issue58-user-meta-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Issue 46 multisite
            runner: bin/run-issue46-multisite.sh
            wordpress_tag: php8.4-apache
          - name: Canonical identity
            runner: bin/run-canonical-identity.sh
            wordpress_tag: 6.9-php8.4-apache
          - name: Canonical identity
            runner: bin/run-canonical-identity.sh
            wordpress_tag: php8.4-apache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP for release ZIP build
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Run specialized regression suite
        run: bash '${{ matrix.runner }}' '${{ matrix.wordpress_tag }}'
